syntax = "proto3";

package mcp;

option go_package = "github.com/the-protobuf-project/mcp/protobuf/mcppb";
option java_multiple_files = true;
option java_outer_classname = "PromptProto";
option java_package = "com.mcp.protobuf";

// MCPRole specifies the intended recipient of a prompt message.
enum MCPRole {
  MCP_ROLE_UNSPECIFIED = 0;

  // The user role; default when omitted.
  MCP_ROLE_USER = 1;

  // The assistant role (e.g. for Claude).
  MCP_ROLE_ASSISTANT = 2;
}

// MCPPrompt defines a reusable prompt template exposed at the service level.
//
// The arguments are defined as a proper proto message referenced by schema.
// Field types, descriptions, required-ness, and enum values are all
// derived from the referenced message's proto definition.
//
// Example:
//   prompts: [
//     {
//       name: "summarize_todos"
//       description: "Summarize all pending todo items for a user"
//       schema: "todo.v1.SummarizeTodosArgs"
//     }
//   ]
message MCPPrompt {
  // Unique prompt name (e.g. "summarize_todos"). Only set when overriding.
  optional string name = 1;
  // Human-readable description of what this prompt does. Only set when overriding.
  optional string description = 2;
  // Fully-qualified proto message name whose fields define the prompt arguments.
  string schema = 3;
  // Role of the generated prompt message; defaults to user.
  MCPRole role = 4;
}

// MCPToolOptions configures an individual RPC method as an MCP tool.
// Used as: option (mcp.tool) = { ... };
message MCPToolOptions {
  // Override the auto-generated MCP tool name. Only set when overriding.
  optional string name = 1;
  // Override the tool description (defaults to the RPC's leading comment). Only set when overriding.
  optional string description = 2;
  // When true, this RPC supports MCP progress notifications. Clients may include
  // progressToken in params._meta; the server will send progress updates during
  // execution. Requires a server-streaming RPC whose response has a oneof with
  // mcp.MCPProgress and the result type.
  optional bool progress = 3;
}
