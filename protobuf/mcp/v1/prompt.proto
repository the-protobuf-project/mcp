syntax = "proto3";

package mcp.v1;

import "mcp/v1/icon.proto";

option go_package = "github.com/the-protobuf-project/mcp/protobuf/mcppb";
option java_multiple_files = true;
option java_outer_classname = "PromptProto";
option java_package = "com.mcp.v1";

// MCPPrompt defines a reusable prompt template exposed at the service level.
//
// The arguments are defined as a proper proto message referenced by schema.
// Field types, descriptions, required-ness, and enum values are all
// derived from the referenced message's proto definition.
//
// Example:
//   prompts: [
//     {
//       name: "summarize_todos"
//       description: "Summarize all pending todo items for a user"
//       schema: "todo.v1.SummarizeTodosArgs"
//     }
//   ]
message MCPPrompt {
  // Unique prompt identifier (e.g. "summarize_todos"). Only set when overriding.
  optional string id = 1;
  // Human-readable description of what this prompt does. Only set when overriding.
  optional string description = 2;
  // Fully-qualified proto message name whose fields define the prompt arguments.
  string schema = 3;
  // Role of the generated prompt message; defaults to user.
  MCPRole role = 4;

  // Display name preferred over id in UI and end-user contexts.
  optional string title = 5;

  // Icons representing the prompt in client UIs.
  repeated MCPIcon icons = 6;
}

// MCPToolOptions configures an individual RPC method as an MCP tool.
// Used as: option (mcp.v1.tool) = { ... };
message MCPToolOptions {
  // Override the auto-generated MCP tool identifier. Only set when overriding.
  optional string id = 1;
  // Override the tool description (defaults to the RPC's leading comment). Only set when overriding.
  optional string description = 2;
  // When true, this RPC supports MCP progress notifications. Clients may include
  // progressToken in params._meta; the server will send progress updates during
  // execution. Requires a server-streaming RPC whose response has a oneof with
  // mcp.v1.MCPProgress and the result type.
  optional bool progress = 3;

  // Behavioural hints, surfaced to clients as the tool's `annotations`. They
  // drive whether a client may invoke the tool without asking the user first.
  //
  // Each is optional because absent means "unknown", which a client must treat
  // as the unsafe answer. A default of false would assert something stronger
  // than the schema knows.
  // The tool does not modify its environment. Typical of Get, List and Search.
  optional bool read_only = 4;

  // The tool may perform destructive updates. Meaningful only when read_only is
  // false. Typical of Delete, and of Update that replaces rather than merges.
  optional bool destructive = 5;

  // Calling the tool repeatedly with the same arguments has no additional
  // effect. Meaningful only when read_only is false. Delete and Update are
  // idempotent under AIP-134; Create generally is not.
  optional bool idempotent = 6;

  // The tool interacts with an open world of external entities — a third-party
  // API, the public internet — rather than a closed, predictable domain.
  optional bool open_world = 7;

  // Display name preferred over id in UI and end-user contexts.
  optional string title = 8;

  // Icons representing the tool in client UIs.
  repeated MCPIcon icons = 9;
}

// MCPRole specifies the intended recipient of a prompt message.
enum MCPRole {
  // No role specified. Treated as MCP_ROLE_USER.
  MCP_ROLE_UNSPECIFIED = 0;

  // The user role; default when omitted.
  MCP_ROLE_USER = 1;

  // The assistant role (e.g. for Claude).
  MCP_ROLE_ASSISTANT = 2;
}
