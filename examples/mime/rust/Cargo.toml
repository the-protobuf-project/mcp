# Compiles the gallery's generated Rust so the MCP handler is type-checked in CI
# rather than only inspected. `cargo check` is the validation; there is no binary
# here — examples/rust is where a full Rust server lives.
[package]
name = "gallery-mcp-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"

[lib]
name = "gallery_mcp_example"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
prost = "0.14"
prost-types = "0.14"
rmcp = { version = "3.1", features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
    "elicitation",
] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tonic = "0.14"
tonic-prost = "0.14"
