name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Go)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  build:
    name: Build Plugin
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build protoc-gen-mcp
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags "-s -w" -o /dev/null ./plugin/cmd/protoc-gen-mcp/

  test:
    name: Test (Go)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test all modules
        run: |
          go test ./...
          cd plugin && go test ./...
          cd ../examples && go test ./...

  bazel:
    name: Build & Test (Bazel)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          # Cache the bazelisk download, the repository cache (external deps),
          # and the disk cache (build outputs) keyed per workflow.
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      # CI runners ship the Android SDK (ANDROID_HOME set), which activates the
      # transitive android_sdk_repository_extension. On Bazel 8+ that extension
      # references the removed @local_config_platform and breaks toolchain
      # resolution. Clear ANDROID_HOME so the extension stays a no-op stub,
      # matching the committed MODULE.bazel.lock (generated without an SDK).
      - name: Bazel build
        run: bazel build //... --repo_env=ANDROID_HOME=
      - name: Bazel test
        run: bazel test //... --repo_env=ANDROID_HOME= --test_output=errors

  cpp:
    name: Build (C++)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.93.0
      # The C++ server links a static library built from the generated Rust
      # bridge, so this job needs both toolchains plus gRPC/protobuf headers.
      # libgrpc++-dev pulls in libprotobuf-dev and the pkg-config files the
      # Makefile probes for.
      - name: Install gRPC and protobuf
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc pkg-config
      - name: Cache cargo (Rust bridge)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            examples/proto/generated/cpp/rust/target
          key: cpp-bridge-${{ hashFiles('examples/proto/generated/cpp/rust/Cargo.toml') }}
          restore-keys: cpp-bridge-
      - name: Make
        working-directory: examples/cpp
        run: make

  rust:
    name: Check (Rust)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.93.0
      - name: Cargo check
        working-directory: examples/rust
        run: cargo check --all-targets

  google-protobuf-lint:
    name: Lint (Google Protobuf)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: the-protobuf-project/setup-google-api-linter@v1.0.0
        with:
          # The buf module root. Files self-import as `mcp/v1/...`, which only
          # resolves when the linter runs from here.
          working-directory: protobuf
          paths: mcp/v1/*.proto
          # Resolve imports through the deps in buf.yaml. Today these protos only
          # import well-known types, which the linter bundles, but nothing here is
          # vendored — the first `google/api/*` import would fail to compile without it.
          buf: true
