version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/examples"
      - "/examples/mime"
    schedule:
      interval: "weekly"
    # One PR per ecosystem and directory for minor and patch updates;
    # majors still arrive on their own so breaking bumps get a review.
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # The BSR SDKs are generated from this repo's own releases.
    ignore:
      - dependency-name: "buf.build/gen/go/the-protobuf-project/*"
  - package-ecosystem: "cargo"
    directories:
      - "/examples/mime/rust"
      - "/examples/rust"
    schedule:
      interval: "weekly"
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
